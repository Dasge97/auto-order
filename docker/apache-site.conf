<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Sin esto Apache se come la cabecera Authorization y las herramientas del agente
    # llegan a PHP sin token, así que se rechazan todas.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
        CGIPassAuth On
    </Directory>

    # Nada fuera de public/ se sirve por HTTP. Ahí están las cartas subidas.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
