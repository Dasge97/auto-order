# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.upload_dir: '%kernel.project_dir%/var/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Storage\ImportFileStorage:
        arguments:
            $uploadDir: '%app.upload_dir%'

    App\Command\ReadMenuCommand:
        arguments:
            $uploadDir: '%app.upload_dir%'

    App\Menu\PdfToImages:
        arguments:
            $workDir: '%kernel.project_dir%/var/pdf-paginas'

    App\Menu\ChatCompletionsMenuExtractor:
        arguments:
            $apiKey: '%env(MENU_API_KEY)%'
            $model: '%env(MENU_MODEL)%'
            $baseUrl: '%env(MENU_API_BASE_URL)%'
            $schemaName: '%env(MENU_SCHEMA_NAME)%'

    App\Menu\MenuExtractorInterface: '@App\Menu\ChatCompletionsMenuExtractor'

    App\Retell\RetellWebhookVerifier:
        arguments:
            $webhookSecret: '%env(RETELL_WEBHOOK_SECRET)%'

    App\Retell\ToolAuthenticator:
        arguments:
            $toolToken: '%env(RETELL_TOOL_TOKEN)%'
