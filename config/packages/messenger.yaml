framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 2
                    delay: 5000
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Leer la carta tarda, así que se hace en el worker y no en la petición web.
            'App\Message\ProcessMenuImport': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
