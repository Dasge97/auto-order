security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un solo administrador, definido en la configuración del servidor. No hay tabla de usuarios.
    providers:
        admin_user:
            memory:
                users:
                    '%env(ADMIN_USER)%':
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Las herramientas del agente y los webhooks de Retell traen su propia
        # autenticación por cabecera y firma, así que no pasan por el login del panel.
        api:
            pattern: ^/(api|webhook)/
            security: false

        main:
            lazy: true
            provider: admin_user
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
