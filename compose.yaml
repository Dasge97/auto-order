# Despliegue de Auto-order.
#
# Tres contenedores: la aplicación, el worker que lee las cartas con OpenAI y la base
# de datos. El puerto se publica en local; quien lo saca a Internet es Traefik.
#
# Se levanta siempre así, para que la contraseña de la base de datos salga del mismo
# fichero que el resto de la configuración:
#
#   docker compose --env-file .env.local up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      APP_ENV: prod
      DATABASE_URL: "postgresql://${POSTGRES_USER:-autoorder}:${POSTGRES_PASSWORD:-autoorder}@database:5432/${POSTGRES_DB:-autoorder}?serverVersion=17&charset=utf8"
    ports:
      - "${APP_PORT:-4141}:80"
    volumes:
      - uploads:/var/www/html/var/uploads
    depends_on:
      database:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      APP_ENV: prod
      DATABASE_URL: "postgresql://${POSTGRES_USER:-autoorder}:${POSTGRES_PASSWORD:-autoorder}@database:5432/${POSTGRES_DB:-autoorder}?serverVersion=17&charset=utf8"
    # Leer una carta tarda; el worker se reinicia cada hora para no acumular memoria.
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv
    volumes:
      - uploads:/var/www/html/var/uploads
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoorder}
      POSTGRES_USER: ${POSTGRES_USER:-autoorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoorder}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-autoorder}", "-U", "${POSTGRES_USER:-autoorder}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
  uploads:
